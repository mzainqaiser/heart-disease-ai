{# Inline SVG icons (no external requests) #}
{% macro icon(name, size=22) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == 'heart' -%}<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>
{%- elif name == 'pulse' -%}<path d="M3 12h4l2.5-7 5 14 2.5-7H21"/>
{%- elif name == 'user' -%}<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
{%- elif name == 'stethoscope' -%}<path d="M6 3v6a4 4 0 0 0 8 0V3M4 3h4M12 3h4"/><path d="M10 13v2a5 5 0 0 0 10 0v-2"/><circle cx="20" cy="11" r="2"/>
{%- elif name == 'shield' -%}<path d="M12 3l8 3v6c0 4.5-3.2 8.3-8 9-4.8-.7-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>
{%- elif name == 'chip' -%}<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>
{%- elif name == 'chart' -%}<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
{%- elif name == 'alert' -%}<path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17.5v.01"/>
{%- elif name == 'check' -%}<path d="M5 12.5l4.5 4.5L19 7.5"/>
{%- elif name == 'arrow' -%}<path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif name == 'back' -%}<path d="M19 12H5M11 6l-6 6 6 6"/>
{%- elif name == 'info' -%}<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/>
{%- endif -%}
</svg>
{%- endmacro %}
