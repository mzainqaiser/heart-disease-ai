{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block title %}{{ title }} - HeartGuard AI{% endblock %}
{% block content %}
<section class="section">
  <div class="container narrow center">
    <div class="card error-card">
      <span class="error-code">{{ code }}</span>
      <h1>{{ title }}</h1>
      <p>{{ message }}</p>
      <a class="btn btn-primary" href="{{ url_for('index') }}">{{ icon('back', 18) }} Back to HeartGuard AI</a>
    </div>
  </div>
</section>
{% endblock %}
